# =====================================================================
# Cepheus Gaming Tweaks - konfigurasi (v1.0.0)
# true = aktif, false = mati. Nilai angka bebas diubah lalu reboot/terapkan.
# =====================================================================

# ----- MODE -----
# gaming (default) : profil lengkap (CPU/GPU/thermal/IO/net/...) saat game.
# global           : HANYA batas frekuensi CPU (*_MAX) yang aktif, berlaku
#                    TERUS (siaga & game); semua fitur lain dimatikan.
MODE=gaming

# ----- pilih bagian yang aktif -----
GP_CPU=true
GP_GPU=true
GP_IO=true
GP_VM=true
GP_NET=true
GP_KERNEL=true

# ----- mode dinamis -----
# true  = profil "game" hanya dipakai saat game/benchmark di foreground;
#         saat keluar game semua dipulihkan ke nilai idle.
# false = profil game dipakai terus (tidak dianjurkan, panas & boros).
GP_DYNAMIC=true

# interval poll deteksi game (detik). Kecil = profil game/idle lebih responsif
# saat ganti app, tapi lebih sering bangun CPU. 2 = rekomendasi.
GP_POLL=2

# ---------------- CPU (kunci maksimum saat game) ----------------
# Profil batas frekuensi tiap cluster saat game (kHz). WebUI memilih ketiganya
# sekaligus. Little=core0-3, Mid=core4-6, Prime=core7. Makin rendah = makin
# adem; GIPS sustained sering justru naik (throttle LMH mulai lebih lambat).
#   Maksimum (stok) : 1785600 / 2419200 / 2841600
#   Seimbang        : 1785600 / 2016000 / 2419200   (rekomendasi)
#   Adem            : 1555200 / 1804800 / 2131200
LITTLE_MAX=1785600
MID_MAX=2419200
PRIME_MAX=2841600
# performance = kunci semua core di frekuensi MAKS (paling ngebut, paling panas)
# Nilai lain yang tersedia di kernel juga bisa dipilih lewat WebUI (Governor).
CPU_GAME_GOV=performance
# governor saat idle/tidak main (default kernel = schedutil)
CPU_IDLE_GOV=schedutil
# KUNCI: paksa scaling_min = scaling_max = frekuensi maks tiap cluster saat game,
# lalu kembalikan ke nilai stok saat idle. Ini anti frame-drop (freq tidak turun).
CPU_LOCK_MAX=true
# pastikan 8 core tetap online saat game (cegah hotplug matikan core)
ALL_CORES_ONLINE=true
# /proc/sys/kernel/sched_boost = 1 saat game (QCOM full boost)
SCHED_BOOST=true
# schedtune.boost untuk cgroup top-app saat game (0=off, makin besar makin agresif)
STUNE_BOOST=30
# turunkan latensi scheduler saat game (preempt lebih cepat).
# stok kernel: latency=10000000 min_gran=3000000 wakeup_gran=2000000 (nanodetik)
SCHED_TUNE=true
SCHED_LATENCY_NS=6000000
SCHED_MIN_GRANULARITY_NS=1000000
SCHED_WAKEUP_GRANULARITY_NS=1000000
# floor frekuensi via msm_performance/cpu_min_freq (kHz, 0=mati).
# berguna kalau governor game bukan "performance" (cegah turun freq saat stutter).
MSMPERF_MIN=0
# input boost (cpu_boost): saat layar disentuh, semua core dipacu ke freq maks
# selama CPU_BOOST_MS agar responsif & tidak drop saat fight.
CPU_BOOST_INPUT=true
CPU_BOOST_MS=2000
SCHED_BOOST_ON_INPUT=true

# ---------------- GPU ----------------
# pwrlevel: 0 = PALING cepat (max clock), 6 = paling pelan. makin KECIL = makin ngebut.
GPU_GAME_PWRLEVEL=0
GPU_IDLE_PWRLEVEL=6
# performance = kunci GPU di clock maks; msm-adreno-tz = adaptif
# Pilihan governor GPU juga tersedia di WebUI (Governor).
GPU_GAME_GOV=performance
GPU_IDLE_GOV=msm-adreno-tz
# 1 = tahan rail/clk/bus GPU selalu nyala saat game (frame pacing stabil, agak panas)
GPU_FORCE_CLK=1
# idle_timer GPU saat game (ms). makin besar = GPU makin enggan turun clock.
GPU_IDLE_TIMER=200
# true = KUNCI GPU tepat di frekuensi tertinggi (770MHz): pin min=max=max_gpuclk
#        sehingga clock tidak pernah turun selama game. Bersama bypass charging
#        ini memberi frame time paling stabil (clock tidak naik-turun).
#        false = hanya floor (min_pwrlevel), GPU masih bisa turun saat sepi.
GPU_GAME_LOCK=true

# ---------------- Bypass Charging (main sambil ngecas) ----------------
# Saat game aktif DAN adaptor terpasang: HP ditenagai langsung oleh adaptor,
# baterai TIDAK diisi (status "Not charging", arus ~0) -> panas & throttling
# jauh berkurang, level baterai tidak naik/turun. Otomatis kembali mengisi
# saat keluar game. Hanya berpengaruh bila adaptor terpasang.
GP_BYPASS_CHARGE=true

# ---------------- DDR / Memory (game saja) ----------------
# Naikkan floor bandwidth & latency DDR/LLCC/gpubw ke batas maksimum node
# selama game, lalu pulihkan saat idle. Membuat frame pacing lebih stabil.
DDR_BOOST=true

# ---------------- Thermal ----------------
# naikkan ambang throttle zona step saat game (GPU stok 85000, CPU stok 110000)
THERMAL_GAME=true
GPU_TRIP_GAME=95000
CPU_TRIP_GAME=115000
# zona lmh-dcvs (throttle hardware LMH, stok 85000=85C). Dinaikkan saat game
# agar LMH mulai lebih lambat; dipulihkan saat idle. 0 = jangan diubah.
# Catatan: batas arus/BCL + sensor isens di silikon TIDAK bisa dimatikan ini.
LMH_TRIP_GAME=95000
# THERMAL UNLOCK: hentikan mi_thermald + thermal-engine, paksa cpu_limits ke max
THERMAL_UNLOCK=true

# ---------------- Touch (driver FTS, game saja) ----------------
# matikan glove/cover/charger-mode yang menurunkan sensitivitas layar saat game
TOUCH_GAME=true
# response boost: matikan grip suppression agar sentuhan lebih responsif saat game
TOUCH_BOOST=true
# nilai grip saat game (0 = filter grip mati). Dipulihkan otomatis saat idle.
TOUCH_GRIP_ENABLE=0
TOUCH_GRIP_AREA=0

# ---------------- I/O (statis) ----------------
IO_SCHED=deadline
IO_READAHEAD_KB=2048
IO_NR_REQUESTS=256

# ---------------- VM (statis) ----------------
VM_VFS_CACHE_PRESSURE=60
VM_DIRTY_WRITEBACK_CS=1000
VM_SWAPPINESS=10
# tambahan min_free_kbytes di atas nilai sekarang
VM_MIN_FREE_EXTRA_KB=32768
VM_STAT_INTERVAL=1

# ---------------- NET (statis, buat game online) ----------------
NET_TCP_LOW_LATENCY=1
NET_TCP_FASTOPEN=3
NET_RMEM_MAX=6291456
NET_WMEM_MAX=6291456
NET_SOMAXCONN=1024
NET_TCP_SYN_BACKLOG=1024
# tcp_rmem / tcp_wmem = "min default max" (byte)
NET_TCP_RMEM=4096 87380 6291456
NET_TCP_WMEM=4096 16384 6291456

# ---------------- NET (tambahan saat game) ----------------
# Tuning latensi tambahan yang hanya aktif selama game (dipulihkan saat idle).
NET_GAME_BOOST=true
# tcp_notsent_lowat: batas data tertunda sebelum dikirim (byte, kecil = latensi rendah)
NET_NOTSOL_LOWAT=16384
# busy polling (0=mati). 50 = respons cepat tanpa terlalu boros.
NET_BUSY_POLL=50
NET_BUSY_READ=50
# 0 = matikan autocorking (paket tidak ditahan menunggu paket lain)
NET_AUTOCORKING=0
# 0 = jangan reset congestion window setelah idle (anti stutter saat reconnect)
NET_SLOW_START_AFTER_IDLE=0
# 1 = jangan simpan metrik koneksi lama (rute baru langsung adaptif)
NET_NO_METRICS_SAVE=1

# ---------------- Kernel misc (statis) ----------------
KERNEL_PERF_CPU_TIME=25

# ---------------- inotify (statis) ----------------
# batas watch file; game/app besar sering butuh lebih dari default (128/8192)
INOTIFY_MAX_USER_INSTANCES=512
INOTIFY_MAX_USER_WATCHES=524288
INOTIFY_MAX_QUEUED_EVENTS=32768

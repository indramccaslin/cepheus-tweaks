<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cepheus Tweaks</title>
<style>
  :root{
    --bg:#0b0e13;--bg2:#0f1420;--card:#141a24;--card2:#1b222f;--line:#28313f;
    --txt:#e8edf5;--dim:#8a96a8;--acc:#4f8cff;--acc2:#7c5cff;--ok:#37c98b;--err:#ff5c6c;
    --warnb:#3a2a12;--warnl:#6b4a17;--warnt:#ffd591;
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--txt);font:15px/1.55 system-ui,-apple-system,Roboto,sans-serif;
    padding:16px 14px 60px;max-width:720px;margin:0 auto;min-height:100vh;
    background:
      radial-gradient(900px 500px at 100% -8%,rgba(124,92,255,.18),transparent 60%),
      radial-gradient(700px 420px at -10% 0%,rgba(79,140,255,.16),transparent 55%),
      linear-gradient(180deg,var(--bg2),var(--bg));
    background-attachment:fixed;
  }
  .top{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
  .logo{width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 22px -8px rgba(79,140,255,.7)}
  .logo svg{width:26px;height:26px;color:#fff}
  .top h1{font-size:19px;margin:0;letter-spacing:.2px}
  .top .sub{color:var(--dim);font-size:12px;margin-top:1px}
  .badge{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--card)}
  .card{background:linear-gradient(180deg,var(--card),#121826);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px -22px #000}
  .card h2{font-size:14px;margin:0 0 4px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.6px;color:#c7d2e4}
  .card h2 svg{width:16px;height:16px;color:var(--acc)}
  .hint{color:var(--dim);font-size:12px;margin-bottom:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .grow{flex:1;min-width:140px}
  input{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;outline:none}
  input:focus{border-color:var(--acc)}
  button{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
  button.danger{background:transparent;border:1px solid var(--err);color:var(--err);padding:8px 12px;font-weight:600}
  button:active{transform:scale(.98)}
  /* mode tiles */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode{position:relative;border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:14px;cursor:pointer;transition:.18s;overflow:hidden}
  .mode .mi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#0f1622;border:1px solid var(--line);margin-bottom:10px;transition:.18s}
  .mode .mi svg{width:22px;height:22px;color:var(--dim);transition:.18s}
  .mode b{display:block;font-size:15px}
  .mode small{display:block;color:var(--dim);font-size:11px;margin-top:3px;line-height:1.35}
  .mode.sel{border-color:transparent;box-shadow:0 0 0 1.5px var(--acc),0 12px 30px -16px var(--acc)}
  .mode.sel .mi{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
  .mode.sel .mi svg{color:#fff}
  .mode.sel b{color:#fff}
  .mode[data-m="gaming"].sel{box-shadow:0 0 0 1.5px #ff6a3d,0 12px 30px -16px #ff6a3d}
  .mode[data-m="gaming"].sel .mi{background:linear-gradient(135deg,#ff8a3d,#ff3d6e)}
  /* list */
  .gl{list-style:none;margin:12px 0 0;padding:0}
  .gl li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .gl li:last-child{border-bottom:0}
  .gl .p{flex:1;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}
  .opt{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .opt:last-child{border-bottom:0}
  .opt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.15s}
  .opt.sel .r{border-color:var(--acc)}
  .opt.sel .r::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
  .opt .b{flex:1;min-width:0}
  .opt .b b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
  .opt .b small{color:var(--dim);font-size:11px}
  .opt.sel .b b{color:var(--acc)}
  /* governor sections */
  .govsec{margin-top:16px}
  .govsec:first-child{margin-top:8px}
  .govhead{display:flex;align-items:baseline;gap:8px;margin:0 2px}
  .govhead b{font-size:12px;color:#c7d2e4;text-transform:uppercase;letter-spacing:.6px}
  .govhead small{color:var(--dim);font-size:11px}
  .govsec .gl{margin-top:4px}
  /* collapsible card header */
  .cardhead{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
  .cardhead h2{margin:0;flex:1}
  .cardhead .count{font-size:11px;color:var(--dim);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .chev{width:20px;height:20px;color:var(--dim);transition:transform .28s ease;flex:0 0 auto}
  .card.open .chev{transform:rotate(180deg)}
  .coll{max-height:0;overflow:hidden;transition:max-height .32s ease}
  .coll.open{max-height:2200px}
  /* cluster header */
  .ci{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#0f1622;border:1px solid var(--line);flex:0 0 auto}
  .ci svg{width:17px;height:17px;color:var(--acc)}
  .ct{flex:1;min-width:0;display:flex;flex-direction:column}
  .ct b{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:#c7d2e4}
  .ct small{color:var(--dim);font-size:11px}
  .cardhead .cur{font-size:12px;font-weight:700;color:var(--acc);background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.3);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:720px;max-height:84vh;border-radius:20px 20px 0 0;padding:16px;overflow:auto;border-top:1px solid var(--line)}
  .app{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .app .ico{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
  .app .n{flex:1;min-width:0}
  .app .n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .n small{color:var(--dim);font-size:11px;word-break:break-all}
  .warn{background:var(--warnb);border:1px solid var(--warnl);color:var(--warnt);padding:10px;border-radius:12px;font-size:12px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#000d;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none;backdrop-filter:blur(6px)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;color:var(--dim);font-size:11px;margin-top:8px}
  .hidden{display:none!important}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  /* ===== v3.7 visual refresh ===== */
  :root{--acc:#4f8cff;--acc2:#9b6bff;--acc3:#22d3ee;--ok:#34e3a4;--err:#ff5c7a}
  html{scroll-behavior:smooth}
  body{
    max-width:760px;padding:18px 14px 76px;
    background:
      radial-gradient(1000px 620px at 110% -10%,rgba(155,107,255,.22),transparent 60%),
      radial-gradient(800px 520px at -15% 5%,rgba(34,211,238,.14),transparent 55%),
      radial-gradient(700px 600px at 50% 110%,rgba(79,140,255,.12),transparent 60%),
      #070a10;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:42px 42px;mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 70%)}
  body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
    background:conic-gradient(from 180deg at 70% 20%,rgba(79,140,255,.08),transparent 30%,rgba(155,107,255,.08),transparent 60%);
    animation:spin 26s linear infinite;filter:blur(60px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;margin-bottom:16px;
    background:linear-gradient(150deg,rgba(79,140,255,.16),rgba(155,107,255,.07) 45%,rgba(20,26,36,.75));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px -40px rgba(79,140,255,.65),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(14px)}
  .hero .glow{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;pointer-events:none;animation:float 7s ease-in-out infinite}
  .hero .g1{width:180px;height:180px;right:-40px;top:-70px;background:#7c5cff}
  .hero .g2{width:150px;height:150px;left:-50px;bottom:-80px;background:#22d3ee;animation-delay:-3s}
  @keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,12px,0) scale(1.08)}}
  .hero .top{position:relative;z-index:1;margin:0}
  .titlewrap{min-width:0}
  .top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
  .top h1 span{background:linear-gradient(90deg,#7dd3fc,#a78bfa 60%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top .sub{display:flex;align-items:center;gap:6px;color:#9aa7bd;font-size:11.5px;margin-top:4px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,227,164,.12)}
  .logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#4f8cff,#9b6bff 60%,#22d3ee);
    box-shadow:0 14px 30px -12px rgba(79,140,255,.9),inset 0 1px 0 rgba(255,255,255,.35)}
  .logo svg{width:28px;height:28px}
  .badge{font-weight:700;color:#dbe6ff;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);padding:6px 11px}
  .pills{position:relative;z-index:1;display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.2px;
    border:1px solid rgba(255,255,255,.1);background:rgba(8,12,20,.45);color:#c6d3ea;padding:6px 10px;border-radius:999px}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .pill.mode{color:#fff;background:linear-gradient(135deg,rgba(79,140,255,.9),rgba(155,107,255,.9));border-color:transparent}
  .pill.mode::before{background:#fff}
  .card{position:relative;background:linear-gradient(180deg,rgba(20,26,36,.88),rgba(15,20,30,.92));
    border:1px solid rgba(255,255,255,.075);border-radius:22px;padding:17px;
    box-shadow:0 24px 50px -34px #000,inset 0 1px 0 rgba(255,255,255,.045);
    backdrop-filter:blur(12px);transition:border-color .25s,transform .25s}
  .card:hover{border-color:rgba(255,255,255,.13)}
  .card::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,92,255,.7),rgba(34,211,238,.55),transparent)}
  .card h2{font-size:12.5px;letter-spacing:.9px;color:#dbe6f8}
  .card h2 svg{width:17px;height:17px}
  .cardhead h2 svg{flex:0 0 auto}
  .hint{color:#8b98ad;font-size:12px}
  input{background:rgba(7,11,18,.75);border-color:rgba(255,255,255,.08);border-radius:14px;padding:12px 13px;transition:.2s}
  input:focus{border-color:rgba(79,140,255,.7);box-shadow:0 0 0 4px rgba(79,140,255,.12)}
  button{border-radius:14px;background:linear-gradient(135deg,#4f8cff,#8b5cf6);box-shadow:0 12px 28px -14px rgba(79,140,255,.8);transition:.18s}
  button:hover{filter:brightness(1.08);transform:translateY(-1px)}
  button:active{transform:scale(.985)}
  button.ghost{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.1)}
  .mode{background:linear-gradient(180deg,rgba(27,34,47,.95),rgba(19,25,35,.95));border-radius:18px;overflow:hidden}
  .mode.sel{background:linear-gradient(160deg,rgba(79,140,255,.18),rgba(124,92,255,.1));box-shadow:0 0 0 1.5px rgba(79,140,255,.9),0 18px 44px -22px rgba(79,140,255,.75)}
  .mode[data-m="gaming"].sel{background:linear-gradient(160deg,rgba(255,106,61,.18),rgba(255,61,110,.1));box-shadow:0 0 0 1.5px rgba(255,106,61,.9),0 18px 44px -22px rgba(255,61,110,.7)}
  .opt{border-radius:12px;padding:11px 10px;transition:background .18s}
  .opt:hover{background:rgba(255,255,255,.03)}
  .opt.sel{background:rgba(79,140,255,.07)}
  .opt.sel .r{border-color:var(--acc);box-shadow:0 0 0 4px rgba(79,140,255,.12)}
  .ci{width:32px;height:32px;border-radius:10px;background:rgba(79,140,255,.1);border-color:rgba(79,140,255,.22)}
  .cur{background:rgba(79,140,255,.12);border-color:rgba(79,140,255,.35);color:#9dc0ff}
  .switch{position:relative;width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);flex:0 0 auto;transition:.22s}
  .switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#8a96a8;transition:.22s}
  .switch.on{background:linear-gradient(135deg,#4f8cff,#9b6bff);border-color:transparent;box-shadow:0 0 22px -4px rgba(79,140,255,.8)}
  .switch.on::after{left:21px;background:#fff}
  .feat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 2px;color:var(--txt);box-shadow:none;cursor:pointer}
  .feat:last-child{border-bottom:0}
  .feat:hover{background:rgba(255,255,255,.025);transform:none;filter:none}
  .feat .fic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.18)}
  .feat .fic svg{width:19px;height:19px;color:#8fb8ff}
  .feat .fb{flex:1;min-width:0}
  .feat .fb b{display:block;font-size:13.5px}
  .feat .fb small{display:block;color:var(--dim);font-size:11px;line-height:1.35;margin-top:2px}
  .feat.on .fic{background:linear-gradient(135deg,rgba(79,140,255,.25),rgba(155,107,255,.18));border-color:rgba(124,92,255,.35)}
  .feat.on .fb b{color:#fff}
  .foot{opacity:.7;letter-spacing:.3px}
  .toast{border-radius:14px;box-shadow:0 16px 40px -16px #000}
</style>
</head>
<body>

<header class="hero">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l0-8Z"/></svg></div>
    <div class="titlewrap">
      <h1>Cepheus <span>Tweaks</span></h1>
      <div class="sub"><span class="dot"></span> Xiaomi Mi 9 &bull; SM8150</div>
    </div>
    <div class="badge" id="verBadge">v1.0.0</div>
  </div>
  <div class="pills">
    <span class="pill mode" id="pillMode">Gaming</span>
    <span class="pill" id="pillCpu">CPU &mdash;</span>
    <span class="pill" id="pillBoost">Boost &mdash;</span>
  </div>
</header>

<div id="noksu" class="warn hidden" data-i18n="noksu"></div>

<div class="card">
  <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg> <span data-i18n="modeTitle"></span></h2>
  <div class="hint" id="modeHint"></div>
  <div class="modes">
    <div class="mode" data-m="global" id="modeGlobal" onclick="pickMode('global')">
      <div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-6-3.7-9S9.5 5.6 12 3Z"/></svg></div>
      <b>Global</b>
      <small data-i18n="globalDesc"></small>
    </div>
    <div class="mode" data-m="gaming" id="modeGaming" onclick="pickMode('gaming')">
      <div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><path d="M6.5 10.5v2M5.5 11.5h2M15.5 11h.01M18 13.2h.01"/></svg></div>
      <b>Gaming</b>
      <small data-i18n="gamingDesc"></small>
    </div>
  </div>
</div>

<div class="hint" style="margin:2px 4px 10px" id="cpuHint"></div>
<div id="cpucards"></div>

<div class="card" id="govcard">
  <div class="cardhead" onclick="toggleGov()">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg> <span data-i18n="govTitle"></span></h2>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="coll" id="govbody">
    <div class="hint" style="margin-top:10px" id="govHint"></div>
    <div id="govlist"></div>
  </div>
</div>

<div class="card" id="boostcard">
  <div class="cardhead" onclick="toggleBoost()">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13l0-8Z"/></svg> <span data-i18n="boostTitle"></span></h2>
    <span class="count" id="boostcount">0</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="coll" id="boostbody">
    <div class="hint" style="margin-top:10px" data-i18n="boostHint"></div>
    <div id="featlist"></div>
  </div>
</div>

<div class="card" id="gamecard">
  <div class="cardhead" onclick="toggleGames()">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg> <span data-i18n="gameTitle"></span></h2>
    <span class="count" id="gcount">0</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </div>
  <div class="coll" id="gamebody">
    <div class="hint" style="margin-top:10px" data-i18n="gameHint"></div>
    <div class="row">
      <input class="grow" id="addpkg" data-i18n-ph="addPh" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button onclick="addGame()" data-i18n="addBtn"></button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" style="flex:1" onclick="openPicker()" data-i18n="pickerBtn"></button>
    </div>
    <ul class="gl" id="glist"></ul>
    <div class="row" style="margin-top:12px">
      <button onclick="saveGames()" data-i18n="saveBtn"></button>
      <button class="ghost" onclick="clearGames()" data-i18n="clearBtn"></button>
    </div>
  </div>
</div>

  <div class="cardhead" onclick="toggleSettings()">

var DEF_DIR = "/data/adb/modules/cepheus-tweaks";
var MODDIR = DEF_DIR;
function hasKsu(){ return typeof ksu !== 'undefined' && ksu; }
/* PENTING: ksu.exec() sinkron (libsu fastCmd) hanya mengembalikan BARIS TERAKHIR.
   exec(cmd,callback) async TIDAK jalan (overload @JavascriptInterface). Jadi:
   pakai ksu.listPackages() untuk daftar app, dan perintah output-1-baris. */
function sh(cmd){
  return new Promise(function(resolve){
    if (!hasKsu()){ resolve(''); return; }
    try{ var r = ksu.exec(cmd); resolve(r == null ? '' : String(r)); }catch(e){ resolve(''); }
  });
}
/* baca file multi-baris: satukan baris jadi satu (delimiter \x01) lalu pecah */
function readLines(p){
  return sh("tr '\\n' '\\001' < '" + p + "' 2>/dev/null").then(function(s){
    return String(s).split('\u0001');
  });
}
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function writeFile(p, c){ return sh("printf '%s' '"+b64(c)+"' | base64 -d > '"+p+"'"); }
function reloadWorker(){ return sh("touch '"+MODDIR+"/.reload'").then(function(){ toast(t('toastSaved')); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function fileGamelist(){ return MODDIR + "/gamelist.txt"; }

/* ===================== mode (global / gaming) ===================== */
function setModeUI(){
  var g = document.getElementById('modeGlobal'), m = document.getElementById('modeGaming');
  if (g) g.classList.toggle('sel', state.mode==='global');
  if (m) m.classList.toggle('sel', state.mode==='gaming');
  var gc = document.getElementById('gamecard');
  if (gc) gc.classList.toggle('hidden', state.mode!=='gaming');
  var mh = document.getElementById('modeHint');
  if (mh) mh.textContent = state.mode==='global' ? t('modeHintGlobal') : t('modeHintGaming');
  var ch = document.getElementById('cpuHint');
  if (ch) ch.textContent = state.mode==='global' ? t('cpuHintGlobal') : t('cpuHintGaming');
  var gh = document.getElementById('govHint');
  if (gh) gh.textContent = state.mode==='global' ? t('govHintGlobal') : t('govHintGaming');
  document.body.dataset.mode = state.mode;
  renderHero();
}
function pickMode(m){
  if (m!=='global' && m!=='gaming') return;
  if (state.mode===m){ setModeUI(); return; }
  state.mode = m; setModeUI();
  var pairs = {}; pairs.MODE = m;
  confSetMany(pairs).then(function(){ return reloadWorker(); });
}

/* ===================== profil CPU (per cluster, semua frekuensi) ===================== */
var CPU_CLUSTERS = [
  {key:"LITTLE_MAX", title:"Little", subId:"core 0-3", subEn:"cores 0-3", policy:"policy0", dflt:"1785600", opts:[]},
  {key:"MID_MAX",    title:"Mid",    subId:"core 4-6", subEn:"cores 4-6", policy:"policy4", dflt:"2419200", opts:[]},
  {key:"PRIME_MAX",  title:"Prime",  subId:"core 7",   subEn:"cores 7",   policy:"policy7", dflt:"2841600", opts:[]}
];
/* fallback bila node tidak terbaca: daftar langkah frekuensi sesuai perangkat */
var FALLBACK_OPTS = [
  ['1785600','1708800','1632000','1555200','1478400','1382400','1305600','1209600','1113600','1036800','940800','844800','768000','672000','576000','499200','403200','300000'],
  ['2419200','2323200','2227200','2131200','2016000','1920000','1804800','1708800','1612800','1497600','1401600','1286400','1171200','1056000','940800','825600','710400'],
  ['2841600','2745600','2649600','2534400','2419200','2323200','2227200','2131200','2016000','1920000','1804800','1708800','1612800','1497600','1401600','1286400','1171200','1056000','940800','825600']
];
/* baca SEMUA frekuensi yang tersedia dari kernel (scaling_available_frequencies).
   ksu.exec() sync hanya mengembalikan baris terakhir -> file ini 1 baris, aman. */
async function loadFreqs(){
  for (var i=0;i<CPU_CLUSTERS.length;i++){
    var c = CPU_CLUSTERS[i], arr = [];
    try{
      var s = await sh("cat /sys/devices/system/cpu/cpufreq/"+c.policy+"/scaling_available_frequencies 2>/dev/null");
      arr = String(s).trim().split(/\s+/).filter(function(x){ return /^\d+$/.test(x); });
    }catch(e){}
    if (!arr.length) arr = FALLBACK_OPTS[i].slice();
    arr.sort(function(a,b){ return Number(b)-Number(a); });   // tertinggi dulu
    var mx = arr[0], mn = arr[arr.length-1];
    c.opts = arr.map(function(v){ return { v:v, tag:(v===mx?'max':(v===mn?'min':'')) }; });
  }
}
function confGet(text, key, dflt){
  var pre = key + "=", lines = String(text).split('\n');
  for (var i=0;i<lines.length;i++){ if (lines[i].indexOf(pre)===0) return lines[i].slice(pre.length).trim(); }
  return dflt;
}
function confSetMany(pairs){
  return readLines(fileConf()).then(function(lines){
    Object.keys(pairs).forEach(function(key){
      var pre = key + "=", found = false;
      for (var i=0;i<lines.length;i++){ if (lines[i].indexOf(pre)===0){ lines[i] = pre + pairs[key]; found = true; break; } }
      if (!found){
        var last = lines.length - 1;
        if (lines[last] === ""){ lines[last] = pre + pairs[key]; lines.push(""); } else { lines.push(pre + pairs[key]); }
      }
    });
    return writeFile(fileConf(), lines.join("\n"));
  });
}
function toggleCluster(k){
  var card = document.getElementById('card_'+k), coll = document.getElementById('coll_'+k);
  if (!card) return;
  var open = !card.classList.contains('open');
  card.classList.toggle('open', open);
  if (coll) coll.classList.toggle('open', open);
  lsSet('cg_clu_'+k, open ? '1' : '0');
}
function renderCpu(){
  var host = document.getElementById('cpucards'); if (!host) return;
  host.innerHTML = CPU_CLUSTERS.map(function(c, ci){
    var sel = state.cpu[c.key] || c.dflt;
    var open = lsGet('cg_clu_'+c.key)==='1';
    var sub = (LANG==='id') ? c.subId : c.subEn;
    var opts = c.opts.map(function(o){
      var s = (String(o.v) === String(sel)) ? ' sel' : '';
      var tag = o.tag==='max' ? t('freqMax') : (o.tag==='min' ? t('freqMin') : '');
      return '<li class="opt'+s+'" onclick="pickCluster('+ci+',\''+o.v+'\')">'+
        '<span class="r"></span>'+
        '<span class="b"><b>'+ghz(o.v)+'</b>'+(tag?'<small>'+esc(tag)+'</small>':'')+'</span></li>';
    }).join('');
    return '<div class="card'+(open?' open':'')+'" id="card_'+c.key+'">'+
      '<div class="cardhead" onclick="toggleCluster(\''+c.key+'\')">'+
        '<span class="ci">'+IC.chip+'</span>'+
        '<span class="ct"><b>'+esc(c.title)+'</b><small>'+esc(sub)+'</small></span>'+
        '<span class="cur">'+esc(ghz(sel))+'</span>'+
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'+
      '</div>'+
      '<div class="coll'+(open?' open':'')+'" id="coll_'+c.key+'"><ul class="gl">'+opts+'</ul></div>'+
    '</div>';
  }).join('');
  renderHero();
}
function pickCluster(ci, v){
  var c = CPU_CLUSTERS[ci]; if (!c) return;
  state.cpu[c.key] = v; renderCpu();
  var pairs = {}; pairs[c.key] = v;
  confSetMany(pairs).then(function(){ return reloadWorker(); });
}

/* ===================== governor ===================== */
function govDesc(name){
  if (!name) return '';
  switch(name){
    case 'performance': return t('govPerfDesc');
    case 'powersave': return t('govPowerDesc');
    case 'userspace': return t('govUserDesc');
    case 'schedutil': return t('govSchedDesc');
    case 'ondemand': case 'interactive': case 'conservative': return t('govOnDemandDesc');
    case 'msm-adreno-tz': return t('govSchedDesc');
    case 'simple_ondemand': case 'cdspl3': case 'compute': case 'mem_latency': case 'bw_hwmon':
    case 'vidc-ar50-llcc': case 'vidc-ar50-ddr': case 'msm-vidc-llcc': case 'msm-vidc-ddr': case 'gpubw_mon': case 'bw_vbif':
      return t('govOtherDesc');
    default: return t('govOtherDesc');
  }
}
async function loadGov(){
  state.govOpts = {cpu:[],gpu:[]};
  try{
    var s = await sh("cat /sys/devices/system/cpu/cpufreq/policy0/scaling_available_governors 2>/dev/null");
    state.govOpts.cpu = String(s).trim().split(/\s+/).filter(function(x){return x;});
  }catch(e){}
  if (!state.govOpts.cpu.length) state.govOpts.cpu = ['performance','schedutil','powersave','userspace'];
  try{
    var g = await sh("cat /sys/class/kgsl/kgsl-3d0/devfreq/available_governors 2>/dev/null");
    state.govOpts.gpu = String(g).trim().split(/\s+/).filter(function(x){return x;});
  }catch(e){}
  if (!state.govOpts.gpu.length) state.govOpts.gpu = ['performance','msm-adreno-tz','powersave','userspace'];
}
function toggleGov(){
  var card = document.getElementById('govcard'), body = document.getElementById('govbody');
  var open = card.classList.toggle('open');
  if (body) body.classList.toggle('open', open);
  lsSet('cg_gov_open', open ? '1' : '0');
}
function renderGov(){
  var host = document.getElementById('govlist'); if (!host) return;
  var secs = [
    {key:'CPU_GAME_GOV', title:t('govCpuGame'), desc:t('govCpuGameDesc'), opts:state.govOpts.cpu},
    {key:'CPU_IDLE_GOV', title:t('govCpuIdle'), desc:t('govCpuIdleDesc'), opts:state.govOpts.cpu},
    {key:'GPU_GAME_GOV', title:t('govGpuGame'), desc:t('govGpuGameDesc'), opts:state.govOpts.gpu},
    {key:'GPU_IDLE_GOV', title:t('govGpuIdle'), desc:t('govGpuIdleDesc'), opts:state.govOpts.gpu}
  ];
  host.innerHTML = secs.map(function(sec){
    var sel = state.gov[sec.key] || '';
    var items = sec.opts.map(function(v){
      var s = (String(v) === String(sel)) ? ' sel' : '';
      return '<li class="opt'+s+'" onclick="pickGov(\''+sec.key+'\',\''+v+'\')">'+
        '<span class="r"></span>'+
        '<span class="b"><b>'+esc(v)+'</b><small>'+esc(govDesc(v))+'</small></span></li>';
    }).join('');
    return '<div class="govsec"><div class="govhead"><b>'+esc(sec.title)+'</b><small>'+esc(sec.desc)+'</small></div><ul class="gl">'+items+'</ul></div>';
  }).join('');
}
function pickGov(key,v){
  if (!key) return;
  state.gov[key] = v; renderGov();
  var pairs = {}; pairs[key] = v;
  confSetMany(pairs).then(function(){ return reloadWorker(); }).then(function(){ toast(t('govToast')); });
}

/* ===================== optimasi game (toggle) ===================== */
var FEATURES = [
  {key:'TOUCH_BOOST', dflt:'true', icon:'touch', titleKey:'featTouch', descKey:'featTouchDesc'},
  {key:'NET_GAME_BOOST', dflt:'true', icon:'net', titleKey:'featNet', descKey:'featNetDesc'},
  {key:'DDR_BOOST', dflt:'true', icon:'ddr', titleKey:'featDdr', descKey:'featDdrDesc'},
  {key:'GPU_GAME_LOCK', dflt:'true', icon:'gpu', titleKey:'featGpu', descKey:'featGpuDesc'},
  {key:'THERMAL_UNLOCK', dflt:'true', icon:'thermal', titleKey:'featThermal', descKey:'featThermalDesc'},
  {key:'GP_BYPASS_CHARGE', dflt:'true', icon:'plug', titleKey:'featBypass', descKey:'featBypassDesc'}
];
function featOn(k){ return String(state.features[k])==='true'; }
function renderFeatures(){
  var host = document.getElementById('featlist'); if (!host) return;
  host.innerHTML = FEATURES.map(function(f){
    var on = featOn(f.key);
    return '<button type="button" class="feat'+(on?' on':'')+'" onclick="toggleFeature(\''+f.key+'\')">'+
      '<span class="fic">'+(IC[f.icon]||IC.chip)+'</span>'+
      '<span class="fb"><b>'+esc(t(f.titleKey))+'</b><small>'+esc(t(f.descKey))+'</small></span>'+
      '<span class="switch'+(on?' on':'')+'"></span></button>';
  }).join('');
  var c = document.getElementById('boostcount');
  if (c) c.textContent = FEATURES.filter(function(f){ return featOn(f.key); }).length + '/' + FEATURES.length;
  renderHero();
}
function toggleFeature(key){
  var f = null;
  for (var i=0;i<FEATURES.length;i++){ if (FEATURES[i].key===key){ f=FEATURES[i]; break; } }
  if (!f) return;
  state.features[key] = featOn(key) ? 'false' : 'true';
  renderFeatures();
  var pairs = {}; pairs[key] = state.features[key];
  confSetMany(pairs).then(function(){ return reloadWorker(); });
}
function toggleBoost(){
  var card = document.getElementById('boostcard'), body = document.getElementById('boostbody');
  var open = card.classList.toggle('open');
  if (body) body.classList.toggle('open', open);
  lsSet('cg_boost_open', open ? '1' : '0');
}
function fmtCap(v){
  var n = Number(v);
  if (!n) return '—';
  return (n/1000000).toFixed(2).replace(/\.?0+$/,'') + 'G';
}
function renderHero(){
  var pm = document.getElementById('pillMode');
  if (pm) pm.textContent = state.mode==='global' ? 'Global Mode' : 'Gaming Mode';
  var pc = document.getElementById('pillCpu');
  if (pc){
    var caps = [state.cpu.LITTLE_MAX, state.cpu.MID_MAX, state.cpu.PRIME_MAX];
    pc.textContent = caps[0] ? ('CPU ' + caps.map(fmtCap).join(' / ')) : 'CPU —';
  }
  var pb = document.getElementById('pillBoost');
  if (pb){
    var n = FEATURES.filter(function(f){ return featOn(f.key); }).length;
    pb.textContent = 'Boost ' + n + '/' + FEATURES.length;
  }
}

/* ===================== app picker ===================== */
var QUICK = [
  ['PUBG Mobile','com.tencent.ig'],
  ['PUBG (KR)','com.pubg.krmobile'],
  ['PUBG (VN)','com.vng.pubgmobile'],
  ['Mobile Legends','com.mobile.legends'],
  ['Free Fire','com.dts.freefireth'],
  ['Free Fire MAX','com.dts.freefiremax'],
  ['COD Mobile','com.activision.callofduty.shooter'],
  ['Genshin Impact','com.miHoYo.GenshinImpact'],
  ['Honkai: Star Rail','com.HoYoverse.hkrpg']
];
function openPicker(){ document.getElementById('modal').classList.add('show'); renderQuick(); loadApps(); }
function closePicker(){ document.getElementById('modal').classList.remove('show'); }
function setStatus(txt){ var e=document.getElementById('appstatus'); if (e) e.textContent = txt || ''; }
function jarr(s){ try{ var v = JSON.parse(s); return (v && v.length) ? v : []; }catch(e){ return []; } }
function norm(s){ return String(s==null?'':s).replace(/^package:/,'').trim(); }
function validPkg(p){ return /^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$/.test(p); }
function parsePkgs(txt){
  var out = [];
  String(txt).split('\n').forEach(function(l){ var p = norm(l); if (validPkg(p)) out.push(p); });
  return out;
}
function renderQuick(){
  var q = document.getElementById('quick'); if (!q) return;
  q.innerHTML = QUICK.map(function(g){
    return '<button class="ghost" style="font-size:12px;padding:6px 10px" onclick="pick(\''+g[1]+'\')">'+esc(g[0])+'</button>';
  }).join('');
}
function fromKsu(type){
  try{ if (hasKsu() && typeof ksu.listPackages === 'function') return jarr(ksu.listPackages(type)).map(norm).filter(validPkg); }catch(e){}
  return [];
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function loadUserApps(){
  var a = fromKsu("user");
  for (var i = 0; i < 4 && !a.length; i++){ await wait(300); a = fromKsu("user"); }
  if (a.length) return a;
  return parsePkgs(await sh("pm list packages -3 2>/dev/null"));
}
async function loadSysApps(){
  var a = fromKsu("system");
  for (var i = 0; i < 4 && !a.length; i++){ await wait(300); a = fromKsu("system"); }
  if (a.length) return a;
  var s = fromKsu("all");
  if (s.length) return s;
  return parsePkgs(await sh("pm list packages -s 2>/dev/null"));
}
async function loadApps(force){
  if (state.apps && !force){ renderApps(); return; }
  state.apps = [];
  document.getElementById('applist').innerHTML = '<div style="color:var(--dim);padding:10px">'+t('loading')+'</div>';
  var showSys = document.getElementById('showsys') && document.getElementById('showsys').checked;
  setStatus(showSys ? t('loadingApps') : '');
  var user = [], sys = [];
  try{ user = await loadUserApps(); }catch(e){}
  if (showSys){ setStatus(t('loadingSys')); try{ sys = await loadSysApps(); }catch(e){} }
  var seen = {}, pkgs = [];
  user.concat(sys).forEach(function(p){ if (p && !seen[p]){ seen[p] = 1; pkgs.push(p); } });
  var names = {}, sysmap = {};
  if (hasKsu() && ksu.getPackagesInfo){
    for (var i = 0; i < pkgs.length; i += 60){
      try{
        jarr(await Promise.resolve(ksu.getPackagesInfo(JSON.stringify(pkgs.slice(i, i + 60))))).forEach(function(it){
          if (it && it.packageName){ names[it.packageName] = it.appLabel || ''; sysmap[it.packageName] = !!it.isSystem; }
        });
      }catch(e){}
    }
  }
  state.apps = pkgs.map(function(p){ return {p:p, n:names[p]||p, u:!sysmap[p]}; })
    .sort(function(a,b){ return String(a.n||a.p).localeCompare(String(b.n||b.p)); });
  setStatus(pkgs.length + (showSys ? (LANG==='id'?' aplikasi (termasuk sistem)':' apps (incl. system)')
                                   : (LANG==='id'?' aplikasi (terpasang)':' apps (installed)')));
  renderApps();
}
function renderApps(){
  var el = document.getElementById('applist'); if (!el) return;
  var q = (document.getElementById('search').value||'').toLowerCase();
  var list = (state.apps||[]).filter(function(a){
    var n = String(a.n||a.p).toLowerCase(), p = String(a.p||'').toLowerCase();
    return !q || n.indexOf(q) >= 0 || p.indexOf(q) >= 0;
  });
  el.innerHTML = list.slice(0,1000).map(function(a){
    var ini = String(a.n||a.p).slice(0,1).toUpperCase();
    return '<div class="app" onclick="pick(\''+a.p+'\')">'+
      '<div class="ico">'+esc(ini)+'</div>'+
      '<div class="n"><b>'+esc(a.n)+'</b><small>'+esc(a.p)+(a.u?'':' &bull; '+esc(t('systemTag')))+'</small></div></div>';
  }).join('') || '<div style="color:var(--dim);padding:10px">'+t('noneApps')+'</div>';
}
function toast(m){ var el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(function(){ el.classList.remove('show'); }, 1900); }
function pick(p){ addPkg(p); toast((LANG==='id'?'Ditambah: ':'Added: ')+p); closePicker(); }

/* ===================== boot ===================== */
async function loadAll(){
  var txt = "";
  try{ txt = (await readLines(fileConf())).join('\n'); }catch(e){}
  state.mode = confGet(txt, "MODE", "gaming");
  if (state.mode !== "global" && state.mode !== "gaming") state.mode = "gaming";
  state.cpu = {};
  await loadFreqs();
  CPU_CLUSTERS.forEach(function(c){ state.cpu[c.key] = confGet(txt, c.key, c.dflt); });
  state.gov = {};
  ['CPU_GAME_GOV','CPU_IDLE_GOV','GPU_GAME_GOV','GPU_IDLE_GOV'].forEach(function(k){
    var d = (k.indexOf('GPU')===0) ? 'performance' : (k.indexOf('IDLE')>=0 ? 'schedutil' : 'performance');
    if (k==='GPU_IDLE_GOV') d='msm-adreno-tz';
    state.gov[k] = confGet(txt, k, d);
  });
  await loadGov();
  state.features = {};
  FEATURES.forEach(function(f){ state.features[f.key] = confGet(txt, f.key, f.dflt); });
  setModeUI(); renderCpu(); renderGov(); renderFeatures(); renderLangs(); renderHero();
}
async function boot(){
  applyI18n();
  if (!hasKsu()) document.getElementById('noksu').classList.remove('hidden');
  try{ if (hasKsu() && ksu.moduleInfo){ var inf=JSON.parse(ksu.moduleInfo()); if(inf&&inf.moduleDir) MODDIR=inf.moduleDir; } }catch(e){}
  document.getElementById('search').addEventListener('input', renderApps);
  var lines = await readLines(fileGamelist());
  state.games = (function(text){ return text.split('\n').map(function(l){return l.trim();}).filter(function(l){ return l && l[0]!=='#'; }); })(lines.join('\n'));
  renderGames();
  if (lsGet('cg_games_open')==='1'){ document.getElementById('gamecard').classList.add('open'); document.getElementById('gamebody').classList.add('open'); }
  if (lsGet('cg_set_open')==='1'){ document.getElementById('setcard').classList.add('open'); document.getElementById('setbody').classList.add('open'); }
  if (lsGet('cg_gov_open')==='1'){ document.getElementById('govcard').classList.add('open'); document.getElementById('govbody').classList.add('open'); }
  if (lsGet('cg_boost_open')==='1'){ document.getElementById('boostcard').classList.add('open'); document.getElementById('boostbody').classList.add('open'); }
  await loadAll();
}
boot();
</script>
